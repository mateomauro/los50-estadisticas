<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Los 50 · Entrenadores</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0B0D12">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="entrenadores.css">
</head>
<body class="ent">
  <!-- ingreso con clave -->
  <main class="candado" id="candado">
    <form class="candado__caja" id="form-clave" autocomplete="off">
      <img class="candado__escudo" src="img/escudo-160.webp" width="160" height="173" alt="Escudo del Club Los 50">
      <h1 class="candado__titulo">Entrenadores</h1>
      <p class="candado__sub">Sección privada: tiene datos de juveniles. Pedile la clave al club.</p>
      <label class="candado__campo">
        <span class="sr">Clave</span>
        <svg aria-hidden="true" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="clave" type="password" placeholder="Clave" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" required>
        <button type="button" class="candado__ver" id="ver-clave" aria-label="Mostrar la clave" aria-pressed="false">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </label>
      <label class="candado__recordar"><input type="checkbox" id="recordar"> Recordar en este dispositivo</label>
      <p class="candado__error" id="error-clave" role="alert" hidden></p>
      <button class="candado__entrar" type="submit" id="entrar">Entrar</button>
    </form>
  </main>

  <!-- la sección (se muestra al abrir con la clave) -->
  <div class="app" id="app" hidden>
    <header class="top">
      <div class="top__in">
        <a class="top__home" href="?" data-ir="inicio" aria-label="Ir al inicio">
          <img class="top__escudo" src="img/escudo-160.webp" width="160" height="173" alt="">
        </a>
        <div class="top__textos">
          <h1 class="top__titulo">Los 50 <span>Entrenadores</span></h1>
          <p class="top__sub" id="sub"></p>
        </div>
      </div>
    </header>

    <main class="vista" id="vista" tabindex="-1"></main>

    <footer class="pie">
      <p>Partidos oficiales de la UAR · actualizado el <span id="actualizado"></span></p>
      <p><button type="button" class="link" id="salir">Cerrar sesión</button></p>
    </footer>
  </div>

  <!-- gráficos: Chart.js 4.5.0 (licencia MIT), servido desde la propia web -->
  <script src="vendor/chart.umd.min.js"></script>
  <script src="entrenadores.data.js"></script>
  <script src="entrenadores.js"></script>
</body>
</html>
