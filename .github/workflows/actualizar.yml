name: Actualizar datos de Los 50

on:
  schedule:
    - cron: "0 12 * * 1,2,3"   # lunes, martes y miércoles a las 9:00 de Argentina (12:00 UTC)
  workflow_dispatch:            # botón "Run workflow" para correrlo a mano

permissions:
  contents: write   # guardar los datos nuevos en el repositorio
  issues: write     # avisar si falta alguna planilla o hay algo para revisar

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Bajar lo nuevo de la BD UAR y regenerar todo
        env:
          UAR_USER: ${{ secrets.UAR_USER }}
          UAR_PASS: ${{ secrets.UAR_PASS }}
          CLAVE_ENTRENADORES: ${{ secrets.CLAVE_ENTRENADORES }}
          CLAVE_REVISION: ${{ secrets.CLAVE_REVISION }}
          PYTHONIOENCODING: utf-8
          TZ: America/Argentina/Buenos_Aires
        run: python actualizar_semana.py

      - name: Guardar los cambios
        id: guardar
        run: |
          git config user.name "los50-actualizador"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web datos_uar revision
          git diff --cached --quiet -- web revision || echo "web=si" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualización automática $(TZ=America/Argentina/Buenos_Aires date +%d/%m/%Y)"
            git push
          fi

      # dos webs separadas, cada una solo con lo suyo (las arma armar_sitios.py):
      # los50-jugadores.pages.dev (Jugadores y Revisar datos) y los50-entrenadores.pages.dev (Entrenadores, con clave).
      # clublos50.pages.dev (la dirección de antes) manda cada link a la web nueva que le toca.
      - name: Publicar las webs en Cloudflare Pages
        if: steps.guardar.outputs.web == 'si' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          python armar_sitios.py
          for web in jugadores entrenadores viejo; do
            (cd "sitios/$web" && npx --yes wrangler@4.151.3 pages deploy --branch main --commit-dirty=true)
          done

      - name: Excel de esta actualización
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: excel-${{ github.run_number }}
          path: |
            *.xlsx
            informe.md
          retention-days: 30

      - name: Avisar si falta algo
        if: hashFiles('aviso.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Los 50 - hay algo para revisar ($(TZ=America/Argentina/Buenos_Aires date +%d/%m))" --body-file aviso.md
