name: Actualizar datos de Los 50

on:
  schedule:
    - cron: "0 12 * * 1,2,3"   # lunes, martes y miércoles a las 9:00 de Argentina (12:00 UTC)
  workflow_dispatch:            # botón "Run workflow" para correrlo a mano

permissions:
  contents: write   # guardar los datos nuevos en el repositorio
  issues: write     # avisar si falta alguna planilla o hay algo para revisar

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Bajar lo nuevo de la BD UAR y regenerar todo
        env:
          UAR_USER: ${{ secrets.UAR_USER }}
          UAR_PASS: ${{ secrets.UAR_PASS }}
          CLAVE_ENTRENADORES: ${{ secrets.CLAVE_ENTRENADORES }}
          PYTHONIOENCODING: utf-8
          TZ: America/Argentina/Buenos_Aires
        run: python actualizar_semana.py

      - name: Guardar los cambios (la web se publica sola en Netlify)
        run: |
          git config user.name "los50-actualizador"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web datos_uar
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualización automática $(TZ=America/Argentina/Buenos_Aires date +%d/%m/%Y)"
            git push
          fi

      - name: Excel de esta actualización
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excel-${{ github.run_number }}
          path: |
            *.xlsx
            informe.md
          retention-days: 30

      - name: Avisar si falta algo
        if: hashFiles('aviso.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Los 50 - hay algo para revisar ($(TZ=America/Argentina/Buenos_Aires date +%d/%m))" --body-file aviso.md
